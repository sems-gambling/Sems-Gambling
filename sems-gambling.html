<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>SEMS GAMBLING</title>
<style>
  :root {
    --pink: #ff2d95;
    --pink-glow: #ff2d9580;
    --neon: #39ff14;
    --neon-glow: #39ff1480;
    --bg: #0a0a0a;
    --card-bg: #141414;
    --surface: #1a1a1a;
    --text: #ffffff;
    --muted: #888;
    --danger: #ff4444;
    --gold: #ffd700;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
    background: #0d1f14;
  }

  /* Header */
  .header {
    padding: 12px 16px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg, rgba(10,20,14,0.97) 0%, transparent 100%);
    z-index: 10;
  }

  .logo {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 1px;
    background: linear-gradient(90deg, var(--pink), var(--neon));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 20px var(--pink-glow);
  }

  .nav-link {
    font-size: 11px;
    font-weight: 700;
    color: var(--neon);
    text-decoration: none;
    border: 1px solid rgba(57,255,20,0.4);
    padding: 6px 12px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }


  .balance-box {
    background: var(--surface);
    border: 1px solid rgba(255,45,149,0.3);
    border-radius: 20px;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 0 15px rgba(255,45,149,0.15);
  }

  .balance-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .balance-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--neon);
    text-shadow: 0 0 10px var(--neon-glow);
  }

  /* Table – classic blackjack felt look */
  .table {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px 14px 12px;
    position: relative;
    min-height: 0;
    margin: 4px 10px;
    border-radius: 0 0 50% 50% / 0 0 28% 28%;
    background:
      radial-gradient(ellipse 120% 80% at 50% 30%, rgba(57,255,20,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at center, #0f3d24 0%, #0a2a18 55%, #071f12 100%);
    border: 3px solid #1a5c38;
    box-shadow:
      inset 0 0 40px rgba(0,0,0,0.45),
      inset 0 8px 20px rgba(0,0,0,0.25),
      0 0 0 6px #0a1a10,
      0 0 0 8px rgba(255,45,149,0.25),
      0 12px 30px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  /* Felt texture overlay */
  .table::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px),
      repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none;
    border-radius: inherit;
    opacity: 0.7;
  }

  /* Blackjack arc line */
  .table::after {
    content: 'BLACKJACK PAYS 3 TO 2';
    position: absolute;
    top: 38%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 2px;
    color: rgba(255,215,0,0.35);
    white-space: nowrap;
    z-index: 1;
    pointer-events: none;
  }

  .dealer-area, .player-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    position: relative;
    z-index: 2;
  }

  .area-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.45);
    font-weight: 700;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  .hand {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 90px;
    position: relative;
  }

  .score {
    font-size: 14px;
    font-weight: 700;
    padding: 3px 12px;
    border-radius: 12px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.1);
    min-width: 40px;
    text-align: center;
  }

  .score.player { color: var(--neon); border-color: rgba(57,255,20,0.3); }
  .score.dealer { color: var(--pink); border-color: rgba(255,45,149,0.3); }
  .score.bust { color: var(--danger); border-color: rgba(255,68,68,0.5); }
  .score.bj { color: var(--gold); border-color: rgba(255,215,0,0.5); box-shadow: 0 0 10px rgba(255,215,0,0.3); }

  /* Cards */
  .card {
    width: 64px;
    height: 92px;
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 4px 14px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 6px;
    position: relative;
    margin-left: -20px;
    transform-origin: center bottom;
    will-change: transform, opacity;
  }

  .card:first-child { margin-left: 0; }

  .card.red { color: #e74c3c; }
  .card.black { color: #1a1a1a; }

  .card .rank {
    font-size: 16px;
    font-weight: 800;
    line-height: 1;
  }

  .card .suit {
    font-size: 20px;
    line-height: 1;
    text-align: center;
  }

  .card .rank-bottom {
    font-size: 16px;
    font-weight: 800;
    line-height: 1;
    transform: rotate(180deg);
    align-self: flex-end;
  }

  .card.hidden {
    background: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    border: 2px solid var(--pink);
    box-shadow: 0 4px 15px rgba(255,45,149,0.35), inset 0 0 20px rgba(255,45,149,0.12);
  }

  .card.hidden .rank,
  .card.hidden .suit,
  .card.hidden .rank-bottom {
    display: none;
  }

  .card.hidden::after {
    content: '♠';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    color: var(--pink);
    opacity: 0.75;
    text-shadow: 0 0 12px var(--pink-glow);
  }

  /* Smooth deal from shoe (top-right) */
  @keyframes dealFromShoe {
    0% {
      opacity: 0;
      transform: translate(90px, -140px) scale(0.5) rotate(28deg);
    }
    55% {
      opacity: 1;
      transform: translate(-6px, 10px) scale(1.05) rotate(-3deg);
    }
    100% {
      opacity: 1;
      transform: translate(0, 0) scale(1) rotate(0deg);
    }
  }

  .card.dealing {
    animation: dealFromShoe 0.65s cubic-bezier(0.22, 0.85, 0.3, 1.05) backwards;
  }

  /* Deck / shoe visual */
  .deck-visual {
    position: absolute;
    top: 10px;
    right: 14px;
    width: 42px;
    height: 60px;
    z-index: 5;
    pointer-events: none;
  }

  .deck-stack {
    position: absolute;
    width: 38px;
    height: 54px;
    border-radius: 5px;
    background: linear-gradient(145deg, #1a1a2e, #0f3460);
    border: 2px solid var(--pink);
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .deck-stack:nth-child(1) { transform: translate(0,0); opacity: 1; }
  .deck-stack:nth-child(2) { transform: translate(2px,-2px); opacity: 0.9; }
  .deck-stack:nth-child(3) { transform: translate(4px,-4px); opacity: 0.75; }

  .deck-stack::after {
    content: '♠';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 16px;
    color: var(--pink);
    opacity: 0.7;
  }

  /* Bet area */
  .bet-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
  }

  .current-bet {
    font-size: 13px;
    color: var(--muted);
  }

  .current-bet span {
    color: var(--gold);
    font-weight: 700;
    font-size: 16px;
  }

  .chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .chip {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 3px solid;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s ease;
    position: relative;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4);
  }

  .chip:active { transform: scale(0.9); }

  .chip.selected {
    transform: scale(1.15);
    box-shadow: 0 0 20px currentColor, 0 3px 8px rgba(0,0,0,0.4);
  }

  .chip[data-value="5"]   { background: #2ecc71; border-color: #27ae60; color: #fff; }
  .chip[data-value="10"]  { background: #3498db; border-color: #2980b9; color: #fff; }
  .chip[data-value="25"]  { background: #9b59b6; border-color: #8e44ad; color: #fff; }
  .chip[data-value="50"]  { background: #e67e22; border-color: #d35400; color: #fff; }
  .chip[data-value="100"] { background: #e74c3c; border-color: #c0392b; color: #fff; }
  .chip[data-value="250"] { background: #f1c40f; border-color: #f39c12; color: #1a1a1a; }

  /* Controls */
  .controls {
    padding: 10px 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: linear-gradient(0deg, #0a1a10 50%, rgba(10,26,16,0.85) 100%);
    border-top: 1px solid rgba(26,92,56,0.4);
  }

  .action-row {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .btn {
    flex: 1;
    max-width: 140px;
    padding: 14px 8px;
    border: none;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s ease;
    position: relative;
    overflow: hidden;
  }

  .btn:active { transform: scale(0.96); }
  .btn:disabled {
    opacity: 0.35;
    pointer-events: none;
  }

  .btn-deal {
    background: linear-gradient(135deg, var(--pink), #c2185b);
    color: #fff;
    box-shadow: 0 4px 20px var(--pink-glow);
    max-width: 200px;
    font-size: 16px;
    padding: 16px;
  }

  .btn-hit {
    background: linear-gradient(135deg, var(--neon), #2ecc71);
    color: #0a0a0a;
    box-shadow: 0 4px 15px var(--neon-glow);
  }

  .btn-stand {
    background: linear-gradient(135deg, #3498db, #2980b9);
    color: #fff;
    box-shadow: 0 4px 15px rgba(52,152,219,0.4);
  }

  .btn-double {
    background: linear-gradient(135deg, var(--gold), #f39c12);
    color: #1a1a1a;
    box-shadow: 0 4px 15px rgba(255,215,0,0.3);
  }

  .btn-split {
    background: linear-gradient(135deg, #9b59b6, #8e44ad);
    color: #fff;
    box-shadow: 0 4px 15px rgba(155,89,182,0.4);
  }

  .btn-reset {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--muted);
    font-size: 11px;
    padding: 8px;
    max-width: 120px;
    margin: 0 auto;
  }

  .btn-new {
    background: linear-gradient(135deg, var(--pink), var(--neon));
    color: #0a0a0a;
    box-shadow: 0 4px 20px rgba(255,45,149,0.3);
    max-width: 220px;
    font-size: 15px;
    padding: 15px;
  }

  /* Message / Result */
  .message {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    min-height: 24px;
    padding: 4px;
  }

  .message.win { color: var(--neon); text-shadow: 0 0 10px var(--neon-glow); }
  .message.lose { color: var(--danger); }
  .message.push { color: var(--gold); }
  .message.bj { color: var(--gold); font-size: 18px; text-shadow: 0 0 15px rgba(255,215,0,0.5); }

  /* Overlay for MAIS NON */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .mais-non-card {
    background: linear-gradient(145deg, #1a0a14, #0a1a0a);
    border: 3px solid var(--pink);
    border-radius: 24px;
    padding: 20px 20px 24px;
    text-align: center;
    max-width: 340px;
    width: 92%;
    box-shadow: 
      0 0 40px var(--pink-glow),
      0 0 80px rgba(57,255,20,0.2),
      inset 0 0 30px rgba(255,45,149,0.1);
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
  }

  .mais-non-card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(from 0deg, transparent, var(--pink), transparent, var(--neon), transparent);
    animation: spin 3s linear infinite;
    opacity: 0.12;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes popIn {
    from { transform: scale(0.5) rotate(-8deg); opacity: 0; }
    to { transform: scale(1) rotate(0); opacity: 1; }
  }

  .mais-non-title {
    font-size: 36px;
    font-weight: 900;
    background: linear-gradient(90deg, var(--pink), var(--neon));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
    margin-bottom: 10px;
    position: relative;
    animation: titlePulse 0.7s ease-in-out infinite alternate;
    z-index: 2;
  }

  @keyframes titlePulse {
    from { transform: scale(1); filter: brightness(1); }
    to { transform: scale(1.06); filter: brightness(1.25); }
  }

  /* ===== REAL KAYDOP PHOTO ===== */
  .kaydop-photo-wrap {
    position: relative;
    width: 200px;
    height: 200px;
    margin: 0 auto 12px;
    z-index: 2;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 
      0 0 0 3px var(--pink),
      0 0 30px var(--pink-glow),
      0 10px 25px rgba(0,0,0,0.5);
    animation: photoPop 0.55s cubic-bezier(0.34, 1.4, 0.64, 1) both,
               photoShake 0.4s ease-in-out 0.55s infinite alternate;
  }

  @keyframes photoPop {
    0%   { transform: scale(0.3) rotate(-15deg); opacity: 0; }
    70%  { transform: scale(1.08) rotate(3deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  @keyframes photoShake {
    from { transform: rotate(-3deg) translateX(-3px); }
    to   { transform: rotate(3deg) translateX(3px); }
  }

  .kaydop-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
    display: block;
  }

  .kaydop-photo-glow {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(255,45,149,0.25) 100%);
    pointer-events: none;
  }

  .kaydop-label {
    font-size: 13px;
    font-weight: 800;
    color: var(--neon);
    letter-spacing: 2.5px;
    text-transform: uppercase;
    text-shadow: 0 0 12px var(--neon-glow);
    z-index: 2;
    position: relative;
  }

  .kaydop-quote {
    font-size: 22px;
    font-weight: 900;
    color: var(--pink);
    margin: 6px 0 4px;
    animation: quoteBounce 0.55s ease-in-out infinite alternate;
    z-index: 2;
    position: relative;
  }

  @keyframes quoteBounce {
    from { transform: scale(1); }
    to   { transform: scale(1.1); }
  }

  .bj-badge {
    font-size: 15px;
    color: var(--gold);
    font-weight: 700;
    margin-top: 4px;
    text-shadow: 0 0 14px rgba(255,215,0,0.55);
    z-index: 2;
    position: relative;
  }

  .mais-non-close {
    margin-top: 14px;
    background: linear-gradient(135deg, var(--pink), var(--neon));
    color: #0a0a0a;
    border: none;
    border-radius: 12px;
    padding: 13px 36px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    text-transform: uppercase;
    position: relative;
    z-index: 2;
  }

  /* Confetti */
  .confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    animation: confettiFall 2s ease-out forwards;
  }

  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* Shoe indicator */
  .shoe-info {
    position: absolute;
    top: 10px;
    left: 14px;
    font-size: 9px;
    color: rgba(255,255,255,0.35);
    opacity: 0.8;
    z-index: 3;
    letter-spacing: 0.5px;
  }

  /* Safe area for iPhone */
  @supports (padding: max(0px)) {
    .header { padding-top: max(12px, env(safe-area-inset-top)); }
    .controls { padding-bottom: max(20px, env(safe-area-inset-bottom)); }
  }

  .nav-link {
    font-size: 11px; font-weight: 700; color: var(--neon);
    border: 1px solid rgba(57,255,20,0.4); padding: 6px 12px; border-radius: 20px;
    background: transparent; cursor: pointer; font-family: inherit; letter-spacing: 0.5px;
  }
  .nav-link.pink { color: var(--pink); border-color: rgba(255,45,149,0.4); }
  .screen { display: none !important; flex-direction: column; flex: 1; min-height: 0; width: 100%; }
  .screen.active { display: flex !important; }
  .cf-main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:10px 16px; min-height:0; }
  .cf-felt { width:100%; max-width:340px; background:radial-gradient(ellipse at center,#0f3d24 0%,#0a2a18 100%); border:2px solid #1a5c38; border-radius:24px; padding:24px 20px 20px; box-shadow:inset 0 0 30px rgba(0,0,0,0.4),0 8px 24px rgba(0,0,0,0.4); display:flex; flex-direction:column; align-items:center; gap:14px; }
  .cf-payout { font-size:11px; color:rgba(255,255,255,0.4); letter-spacing:0.5px; }
  .cf-stage { width:150px; height:150px; perspective:900px; position:relative; }
  .cf-shadow { position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); width:90px; height:14px; background:radial-gradient(ellipse,rgba(0,0,0,0.55),transparent 70%); border-radius:50%; }
  .cf-coin { width:100%; height:100%; position:relative; transform-style:preserve-3d; z-index:1; }
  .cf-coin.flipping-pile { animation: flipToPile 1.6s cubic-bezier(0.2,0.55,0.3,1) forwards; }
  .cf-coin.flipping-face { animation: flipToFace 1.6s cubic-bezier(0.2,0.55,0.3,1) forwards; }
  @keyframes flipToPile {
    0% { transform: rotateY(0deg) rotateX(0deg) scale(1); }
    15% { transform: rotateY(400deg) rotateX(30deg) scale(1.12); }
    35% { transform: rotateY(950deg) rotateX(-25deg) scale(1.15); }
    55% { transform: rotateY(1500deg) rotateX(18deg) scale(1.1); }
    75% { transform: rotateY(2000deg) rotateX(-8deg) scale(1.04); }
    100% { transform: rotateY(2160deg) rotateX(0deg) scale(1); }
  }
  @keyframes flipToFace {
    0% { transform: rotateY(0deg) rotateX(0deg) scale(1); }
    15% { transform: rotateY(400deg) rotateX(30deg) scale(1.12); }
    35% { transform: rotateY(950deg) rotateX(-25deg) scale(1.15); }
    55% { transform: rotateY(1500deg) rotateX(18deg) scale(1.1); }
    75% { transform: rotateY(2000deg) rotateX(-8deg) scale(1.04); }
    100% { transform: rotateY(2340deg) rotateX(0deg) scale(1); }
  }
  .cf-coin.show-pile { transform: rotateY(0deg); }
  .cf-coin.show-face { transform: rotateY(180deg); }
  .cf-side { position:absolute; inset:0; border-radius:50%; backface-visibility:hidden; overflow:hidden; background:linear-gradient(145deg,#e8ecf0 0%,#b8c0c8 40%,#8a949e 100%); box-shadow:0 0 0 4px #6a7380,0 0 0 6px rgba(192,200,208,0.35),0 8px 22px rgba(0,0,0,0.5),inset 0 0 24px rgba(255,255,255,0.2); }
  .cf-side.pile { transform: rotateY(0deg); }
  .cf-side.face { transform: rotateY(180deg); }
  .cf-side img { width:100%; height:100%; object-fit:cover; object-position:center 22%; border-radius:50%; filter:contrast(1.3) brightness(1.08); opacity:0.9; }
  .cf-side::before { content:''; position:absolute; inset:5px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.25); box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12); pointer-events:none; z-index:3; }
  .cf-side::after { content:''; position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle at 30% 20%,rgba(255,255,255,0.45) 0%,transparent 36%),radial-gradient(circle at 70% 80%,rgba(0,0,0,0.25) 0%,transparent 40%); pointer-events:none; }
  .cf-label { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); font-size:10px; font-weight:900; letter-spacing:1.5px; color:rgba(30,35,40,0.75); text-shadow:0 1px 0 rgba(255,255,255,0.35); background:rgba(255,255,255,0.3); padding:2px 9px; border-radius:6px; z-index:2; }
  .cf-result { font-size:17px; font-weight:800; min-height:26px; text-align:center; }
  .cf-result.win { color:var(--neon); text-shadow:0 0 12px var(--neon-glow); }
  .cf-result.lose { color:#ff4d6a; }
  .cf-result.wait { color:var(--muted); font-size:13px; font-weight:600; }
  .cf-bet { font-size:13px; color:var(--muted); }
  .cf-bet span { color:var(--gold); font-weight:700; font-size:15px; }
  .cf-chips { display:flex; gap:9px; justify-content:center; flex-wrap:wrap; }
  .cf-chip { width:46px; height:46px; border-radius:50%; border:3px solid; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; cursor:pointer; }
  .cf-chip:active { transform:scale(0.9); }
  .cf-chip.selected { transform:scale(1.12); box-shadow:0 0 14px currentColor; }
  .cf-chip[data-value="5"] { background:#2ecc71; border-color:#27ae60; color:#fff; }
  .cf-chip[data-value="10"] { background:#3498db; border-color:#2980b9; color:#fff; }
  .cf-chip[data-value="25"] { background:#9b59b6; border-color:#8e44ad; color:#fff; }
  .cf-chip[data-value="50"] { background:#e67e22; border-color:#d35400; color:#fff; }
  .cf-chip[data-value="100"] { background:#e74c3c; border-color:#c0392b; color:#fff; }
  .cf-chip[data-value="250"] { background:#f1c40f; border-color:#f39c12; color:#1a1a1a; }
  .cf-choices { display:flex; gap:12px; width:100%; max-width:280px; }
  .cf-choice { flex:1; padding:15px 8px; border:none; border-radius:14px; font-size:14px; font-weight:900; letter-spacing:1px; cursor:pointer; }
  .cf-choice:disabled { opacity:0.35; pointer-events:none; }
  .cf-btn-pile { background:linear-gradient(135deg,#e8ecf0,#9aa3ab); color:#1a1a1a; box-shadow:0 4px 16px rgba(150,160,170,0.35); }
  .cf-btn-face { background:linear-gradient(135deg,#d0d5dc,#7a8490); color:#111; box-shadow:0 4px 16px rgba(100,110,120,0.35); }
  .cf-choice.picked { outline:3px solid var(--pink); outline-offset:2px; }
  .cf-footer { padding:8px 16px 20px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .cf-reset { background:transparent; border:1px solid rgba(255,255,255,0.12); color:var(--muted); font-size:11px; padding:7px 14px; border-radius:10px; cursor:pointer; }

</style>
</head>

  <!-- Result phase -->

      <button class="btn btn-new" id="btnNew">NOUVELLE PARTIE</button>
    </div>
  </div>

  function playChipSound() {
    // soft click via WebAudio fallback
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'triangle';
      o.frequency.value = 1200;
      g.gain.setValueAtTime(0.06, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.07);
    } catch(e) {}
  }

    playChipSound();

  // Custom Phonk Drop for Blackjack (Tiki-style)
  function playTikiTiki() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;

      // Master gain with slight distortion feel
      const master = ctx.createGain();
      master.gain.value = 0.7;
      master.connect(ctx.destination);

      // --- 1. Pre-drop riser (0 - 0.35s) ---
      const riser = ctx.createOscillator();
      const riserG = ctx.createGain();
      const riserF = ctx.createBiquadFilter();
      riser.type = 'sawtooth';
      riser.frequency.setValueAtTime(80, now);
      riser.frequency.exponentialRampToValueAtTime(400, now + 0.32);
      riserF.type = 'lowpass';
      riserF.frequency.setValueAtTime(200, now);
      riserF.frequency.exponentialRampToValueAtTime(2000, now + 0.32);
      riserG.gain.setValueAtTime(0.001, now);
      riserG.gain.linearRampToValueAtTime(0.18, now + 0.25);
      riserG.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
      riser.connect(riserF); riserF.connect(riserG); riserG.connect(master);
      riser.start(now); riser.stop(now + 0.4);

      // --- 2. Heavy 808-style sub drop (0.32s) ---
      function hit808(t, freq, dur, vol) {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(freq, t);
        o.frequency.exponentialRampToValueAtTime(freq * 0.45, t + dur);
        g.gain.setValueAtTime(0.001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + dur + 0.02);
      }
      hit808(now + 0.32, 55, 0.55, 0.55);   // big boom
      hit808(now + 0.32, 110, 0.35, 0.25);  // harmonic

      // --- 3. Rapid "TIKI TIKI" vocal-style chops ---
      // Square + bandpass to mimic chopped vocal
      function tikiChop(t, freq, dur, vol) {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        const bp = ctx.createBiquadFilter();
        o.type = 'square';
        o.frequency.value = freq;
        bp.type = 'bandpass';
        bp.frequency.value = freq * 1.8;
        bp.Q.value = 4;
        g.gain.setValueAtTime(0.001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(bp); bp.connect(g); g.connect(master);
        o.start(t); o.stop(t + dur + 0.01);
      }

      // Pattern: TIKI TIKI TIKI TI-  (phonk cadence)
      const chops = [
        [0.34, 720, 0.06, 0.22],
        [0.41, 880, 0.06, 0.22],
        [0.48, 720, 0.06, 0.20],
        [0.55, 880, 0.06, 0.20],
        [0.62, 720, 0.05, 0.18],
        [0.68, 980, 0.08, 0.24],
        [0.78, 720, 0.05, 0.16],
        [0.84, 880, 0.05, 0.16],
        [0.90, 1100, 0.12, 0.26]
      ];
      chops.forEach(function(c) {
        tikiChop(now + c[0], c[1], c[2], c[3]);
      });

      // --- 4. Second 808 hit + punch ---
      hit808(now + 0.72, 48, 0.45, 0.4);
      hit808(now + 0.72, 96, 0.28, 0.18);

      // --- 5. Distorted noise crash / grit ---
      function noiseBurst(t, dur, vol, freq) {
        const len = Math.floor(ctx.sampleRate * dur);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.5);
        }
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = freq;
        bp.Q.value = 1.5;
        const g = ctx.createGain();
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        src.connect(bp); bp.connect(g); g.connect(master);
        src.start(t);
      }
      noiseBurst(now + 0.32, 0.12, 0.2, 2500);  // drop impact
      noiseBurst(now + 0.72, 0.1, 0.15, 1800);

      // --- 6. Final rising stabs ---
      [0.95, 1.02, 1.09].forEach(function(off, i) {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sawtooth';
        o.frequency.value = 440 + i * 110;
        g.gain.setValueAtTime(0.001, now + off);
        g.gain.exponentialRampToValueAtTime(0.12, now + off + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, now + off + 0.1);
        o.connect(g); g.connect(master);
        o.start(now + off); o.stop(now + off + 0.12);
      });

    } catch (e) {}
  }

  // ===== SHOE =====
  function createShoe() {
    shoe = [];
    for (let d = 0; d < DECKS; d++) {
      for (const suit of SUITS) {
        for (const rank of RANKS) {
          shoe.push({ rank, suit, value: VALUES[rank] });
        }
      }
    }
    // Fisher-Yates
    for (let i = shoe.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shoe[i], shoe[j]] = [shoe[j], shoe[i]];
    }
    updateShoeInfo();
  }

  function drawCard() {
    if (shoe.length < 52) createShoe(); // reshuffle when low
    updateShoeInfo();
    return shoe.pop();
  }

  function updateShoeInfo() {
    shoeInfo.textContent = 'Sabot: ' + shoe.length;
  }

  // ===== HAND VALUE =====
  function handValue(hand) {
    let total = 0;
    let aces = 0;
    for (const c of hand) {
      total += c.value;
      if (c.rank === 'A') aces++;
    }
    while (total > 21 && aces > 0) {
      total -= 10;
      aces--;
    }
    return total;
  }

  function isBlackjack(hand) {
    return hand.length === 2 && handValue(hand) === 21;
  }

  function isSoft(hand) {
    let total = 0, aces = 0;
    for (const c of hand) {
      total += c.value;
      if (c.rank === 'A') aces++;
    }
    return aces > 0 && total <= 21;
  }

  // ===== RENDER =====
  function cardHTML(card, hidden = false, delay = 0, isNew = false) {
    const animClass = isNew ? 'dealing' : '';
    if (hidden) {
      return `<div class="card hidden ${animClass}" style="animation-delay:${delay}ms"></div>`;
    }
    const isRed = card.suit === '♥' || card.suit === '♦';
    return `<div class="card ${isRed ? 'red' : 'black'} ${animClass}" style="animation-delay:${delay}ms">
      <div class="rank">${card.rank}</div>
      <div class="suit">${card.suit}</div>
      <div class="rank-bottom">${card.rank}</div>
    </div>`;
  }

  let lastPlayerCount = 0;
  let lastDealerCount = 0;

  function renderHands(animateNew = true) {
    // Dealer
    let dHTML = '';
    dealerHand.forEach((c, i) => {
      const hide = dealerHidden && i === 1;
      const isNew = animateNew && i >= lastDealerCount;
      dHTML += cardHTML(c, hide, isNew ? (i - lastDealerCount) * 220 : 0, isNew);
    });
    dealerHandEl.innerHTML = dHTML;
    lastDealerCount = dealerHand.length;

    // Player
    let pHTML = '';
    playerHand.forEach((c, i) => {
      const isNew = animateNew && i >= lastPlayerCount;
      pHTML += cardHTML(c, false, isNew ? (i - lastPlayerCount) * 220 : 0, isNew);
    });
    playerHandEl.innerHTML = pHTML;
    lastPlayerCount = playerHand.length;

    // Scores
    const pVal = handValue(playerHand);
    playerScoreEl.textContent = pVal || '—';
    playerScoreEl.className = 'score player' + (pVal > 21 ? ' bust' : '') + (isBlackjack(playerHand) ? ' bj' : '');

    if (dealerHidden) {
      const visible = dealerHand[0] ? dealerHand[0].value : 0;
      // Soft ace display
      if (dealerHand[0] && dealerHand[0].rank === 'A') {
        dealerScoreEl.textContent = '1/11';
      } else {
        dealerScoreEl.textContent = visible || '—';
      }
      dealerScoreEl.className = 'score dealer';
    } else {
      const dVal = handValue(dealerHand);
      dealerScoreEl.textContent = dVal || '—';
      dealerScoreEl.className = 'score dealer' + (dVal > 21 ? ' bust' : '') + (isBlackjack(dealerHand) ? ' bj' : '');
    }
  }

  function setPhase(phase) {
    gamePhase = phase;
    bettingUI.style.display = phase === 'betting' ? 'block' : 'none';
    playingUI.style.display = phase === 'playing' ? 'block' : 'none';
    resultUI.style.display = phase === 'result' ? 'block' : 'none';
  }

  function setMessage(text, type = '') {
    messageEl.textContent = text;
    messageEl.className = 'message ' + type;
  }

  // ===== GAME LOGIC =====
  function selectChip(value) {
    if (gamePhase !== 'betting') return;
    if (value > balance) return;
    unlockAudio();
    playChipSound();
    currentBet = value;
    betDisplay.textContent = formatMoney(currentBet);
    btnDeal.disabled = currentBet === 0 || currentBet > balance;

    document.querySelectorAll('.chip').forEach(c => {
      c.classList.toggle('selected', parseInt(c.dataset.value) === value);
    });
  }

  function startDeal() {
    if (currentBet <= 0 || currentBet > balance) return;
    unlockAudio();
    playClickSound();

    balance -= currentBet;
    updateBalanceUI();

    playerHand = [];
    dealerHand = [];
    dealerHidden = true;
    canDouble = true;
    canSplit = false;
    isSplit = false;
    splitHands = [];
    currentSplitIndex = 0;
    lastPlayerCount = 0;
    lastDealerCount = 0;
    setMessage('');
    setPhase('playing');
    btnHit.disabled = true;
    btnStand.disabled = true;
    btnDouble.disabled = true;
    btnSplit.style.display = 'none';

    const sequence = [
      () => { playerHand.push(drawCard()); playDealSound(); renderHands(true); },
      () => { dealerHand.push(drawCard()); playDealSound(); renderHands(true); },
      () => { playerHand.push(drawCard()); playDealSound(); renderHands(true); },
      () => { dealerHand.push(drawCard()); playDealSound(); renderHands(true); }
    ];

    let step = 0;
    function nextCard() {
      if (step < sequence.length) {
        sequence[step]();
        step++;
        setTimeout(nextCard, 480);
      } else {
        const playerBJ = isBlackjack(playerHand);
        const dealerBJ = isBlackjack(dealerHand);

        if (playerBJ || dealerBJ) {
          setTimeout(() => {
            dealerHidden = false;
            lastDealerCount = 0;
            renderHands(true);
            setTimeout(() => resolveNaturals(playerBJ, dealerBJ), 700);
          }, 550);
        } else {
          // Check split eligibility (same rank)
          canSplit = playerHand.length === 2 &&
                     playerHand[0].rank === playerHand[1].rank &&
                     currentBet <= balance;
          updateActionButtons();
        }
      }
    }
    nextCard();
  }

  function resolveNaturals(playerBJ, dealerBJ) {
    if (playerBJ && dealerBJ) {
      balance += currentBet;
      setMessage('Égalité — Blackjack des deux côtés', 'push');
      updateBalanceUI();
      setPhase('result');
    } else if (playerBJ) {
      const win = Math.floor(currentBet * 2.5);
      balance += win;
      setMessage('BLACKJACK ! +' + formatMoney(win - currentBet), 'bj');
      updateBalanceUI();
      playBlackjackSound();
      showMaisNon();
      setPhase('result');
    } else {
      playLoseSound();
      setMessage('Croupier Blackjack — Vous perdez', 'lose');
      setPhase('result');
    }
  }

  function updateActionButtons() {
    const pVal = handValue(playerHand);
    btnHit.disabled = pVal >= 21;
    btnStand.disabled = false;
    btnDouble.disabled = !canDouble || currentBet > balance || playerHand.length !== 2;
    if (canSplit && playerHand.length === 2 && !isSplit) {
      btnSplit.style.display = 'block';
      btnSplit.disabled = currentBet > balance;
    } else {
      btnSplit.style.display = 'none';
    }
  }

  function hit() {
    if (gamePhase !== 'playing') return;
    unlockAudio();
    playClickSound();
    canDouble = false;
    canSplit = false;
    btnSplit.style.display = 'none';

    playerHand.push(drawCard());
    playDealSound();
    renderHands(true);

    const pVal = handValue(playerHand);
    if (pVal > 21) {
      playBustSound();
      if (isSplit) {
        finishCurrentSplitHand('bust');
      } else {
        setMessage('BUST ! Vous perdez', 'lose');
        setPhase('result');
      }
    } else if (pVal === 21) {
      stand();
    } else {
      updateActionButtons();
    }
  }

  function stand() {
    if (gamePhase !== 'playing') return;
    unlockAudio();
    playClickSound();

    if (isSplit) {
      finishCurrentSplitHand('stand');
      return;
    }

    dealerHidden = false;
    lastDealerCount = 0;
    renderHands(true);
    setPhase('result');
    setTimeout(dealerPlay, 750);
  }

  function dealerPlay() {
    let dVal = handValue(dealerHand);

    function drawNext() {
      if (dVal < 17) {
        dealerHand.push(drawCard());
        playDealSound();
        renderHands(true);
        dVal = handValue(dealerHand);
        setTimeout(drawNext, 650);
      } else {
        if (isSplit) {
          resolveSplitGame();
        } else {
          resolveGame();
        }
      }
    }
    drawNext();
  }

  function doubleDown() {
    if (gamePhase !== 'playing' || !canDouble || currentBet > balance) return;
    unlockAudio();
    playClickSound();

    balance -= currentBet;
    currentBet *= 2;
    betDisplay.textContent = formatMoney(currentBet);
    updateBalanceUI();
    canDouble = false;
    canSplit = false;
    btnSplit.style.display = 'none';

    // Face-down then flip animation for double card
    const newCard = drawCard();
    playerHand.push(newCard);

    // First render as hidden
    const tempHidden = true;
    let pHTML = '';
    playerHand.forEach((c, i) => {
      const isLast = i === playerHand.length - 1;
      pHTML += cardHTML(c, isLast, isLast ? 0 : 0, isLast);
    });
    playerHandEl.innerHTML = pHTML;
    playDealSound();

    // After short delay, flip face up
    setTimeout(() => {
      lastPlayerCount = playerHand.length - 1;
      renderHands(true);
      playDealSound();

      const pVal = handValue(playerHand);
      if (pVal > 21) {
        playBustSound();
        if (isSplit) {
          finishCurrentSplitHand('bust');
        } else {
          setMessage('BUST ! Vous perdez', 'lose');
          setPhase('result');
        }
      } else {
        stand();
      }
    }, 650);
  }

  function doSplit() {
    if (!canSplit || currentBet > balance || playerHand.length !== 2) return;
    unlockAudio();
    playSplitSound();

    balance -= currentBet;
    updateBalanceUI();

    isSplit = true;
    canSplit = false;
    canDouble = true;
    btnSplit.style.display = 'none';

    // Create two hands from the pair
    const card1 = playerHand[0];
    const card2 = playerHand[1];

    splitHands = [
      { cards: [card1], bet: currentBet, done: false, result: null },
      { cards: [card2], bet: currentBet, done: false, result: null }
    ];

    // Deal one extra card to first hand
    splitHands[0].cards.push(drawCard());
    currentSplitIndex = 0;
    playerHand = splitHands[0].cards;
    lastPlayerCount = 0;

    setMessage('Main 1 / 2 — SPLIT', '');
    playDealSound();
    renderHands(true);
    updateActionButtons();
  }

  function finishCurrentSplitHand(reason) {
    splitHands[currentSplitIndex].cards = [...playerHand];
    splitHands[currentSplitIndex].done = true;
    splitHands[currentSplitIndex].result = reason;

    if (currentSplitIndex === 0) {
      // Move to second hand
      currentSplitIndex = 1;
      playerHand = splitHands[1].cards;
      // Deal second card to hand 2 if only 1 card
      if (playerHand.length === 1) {
        playerHand.push(drawCard());
        playDealSound();
      }
      lastPlayerCount = 0;
      canDouble = playerHand.length === 2;
      setMessage('Main 2 / 2 — SPLIT', '');
      renderHands(true);
      updateActionButtons();
    } else {
      // Both hands done → dealer plays
      setMessage('Croupier joue…', '');
      dealerHidden = false;
      lastDealerCount = 0;
      renderHands(true);
      setPhase('result');
      setTimeout(dealerPlay, 850);
    }
  }

  function resolveSplitGame() {
    const dVal = handValue(dealerHand);
    let totalWin = 0;
    let messages = [];

    splitHands.forEach((hand, idx) => {
      const pVal = handValue(hand.cards);
      const bet = hand.bet;

      if (pVal > 21) {
        messages.push(`Main ${idx + 1}: Bust`);
      } else if (dVal > 21 || pVal > dVal) {
        totalWin += bet * 2;
        messages.push(`Main ${idx + 1}: +${formatMoney(bet)}`);
      } else if (pVal < dVal) {
        messages.push(`Main ${idx + 1}: Perdu`);
      } else {
        totalWin += bet;
        messages.push(`Main ${idx + 1}: Égalité`);
      }
    });

    balance += totalWin;
    updateBalanceUI();

    if (totalWin > currentBet * 2) {
      playWinSound();
      setMessage(messages.join(' · '), 'win');
    } else if (totalWin === 0) {
      playLoseSound();
      setMessage(messages.join(' · '), 'lose');
    } else {
      setMessage(messages.join(' · '), 'push');
    }
    setPhase('result');
  }

  function resolveGame() {
    const pVal = handValue(playerHand);
    const dVal = handValue(dealerHand);

    if (dVal > 21) {
      const win = currentBet * 2;
      balance += win;
      playWinSound();
      setMessage('Croupier BUST ! +' + formatMoney(currentBet), 'win');
    } else if (pVal > dVal) {
      const win = currentBet * 2;
      balance += win;
      playWinSound();
      setMessage('Vous gagnez ! +' + formatMoney(currentBet), 'win');
    } else if (pVal < dVal) {
      playLoseSound();
      setMessage('Croupier gagne — Vous perdez', 'lose');
    } else {
      balance += currentBet;
      setMessage('Égalité — Mise rendue', 'push');
    }
    updateBalanceUI();
    setPhase('result');
  }

  function newRound() {
    unlockAudio();
    playClickSound();
    currentBet = 0;
    betDisplay.textContent = '0 €';
    playerHand = [];
    dealerHand = [];
    dealerHidden = true;
    isSplit = false;
    splitHands = [];
    currentSplitIndex = 0;
    canSplit = false;
    lastPlayerCount = 0;
    lastDealerCount = 0;
    setMessage('');
    dealerScoreEl.textContent = '—';
    playerScoreEl.textContent = '—';
    dealerScoreEl.className = 'score dealer';
    playerScoreEl.className = 'score player';
    dealerHandEl.innerHTML = '';
    playerHandEl.innerHTML = '';
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
    btnDeal.disabled = true;
    btnSplit.style.display = 'none';
    setPhase('betting');

    if (balance < 5) {
      setMessage('Solde insuffisant — Réinitialisez !', 'lose');
    }
  }

  function resetBalance() {
    if (confirm('Réinitialiser le solde à 1 000 € ?')) {
      balance = STARTING_BALANCE;
      updateBalanceUI();
      newRound();
    }
  }

  // ===== MAIS NON =====
  function playMaisNonSound() {
    try {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance('Mais non !');
        utter.lang = 'fr-FR';
        utter.rate = 0.95;
        utter.pitch = 1.15;
        utter.volume = 1;

        // Prefer a French voice if available
        const voices = window.speechSynthesis.getVoices();
        const frVoice = voices.find(v => v.lang.startsWith('fr') && (v.name.includes('Thomas') || v.name.includes('Amelie') || v.name.includes('Google') || v.name.includes('Audrey')));
        if (frVoice) utter.voice = frVoice;
        else {
          const anyFr = voices.find(v => v.lang.startsWith('fr'));
          if (anyFr) utter.voice = anyFr;
        }

        window.speechSynthesis.speak(utter);
      }
    } catch (e) {}
  }

  function showMaisNon() {
    // Confetti
    const colors = ['#ff2d95', '#39ff14', '#ffd700', '#3498db', '#e74c3c'];
    for (let i = 0; i < 50; i++) {
      const conf = document.createElement('div');
      conf.className = 'confetti';
      conf.style.left = Math.random() * 100 + 'vw';
      conf.style.background = colors[Math.floor(Math.random() * colors.length)];
      conf.style.animationDelay = Math.random() * 0.4 + 's';
      conf.style.animationDuration = 1.4 + Math.random() * 1.6 + 's';
      document.body.appendChild(conf);
      setTimeout(() => conf.remove(), 3200);
    }

    playMaisNonSound();
    overlay.classList.add('show');
  }

  function hideMaisNon() {
    overlay.classList.remove('show');
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  }

  // ===== EVENTS =====
  chipsEl.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (chip) selectChip(parseInt(chip.dataset.value));
  });

  btnDeal.addEventListener('click', startDeal);
  btnHit.addEventListener('click', hit);
  btnStand.addEventListener('click', stand);
  btnDouble.addEventListener('click', doubleDown);
  btnSplit.addEventListener('click', doSplit);
  btnNew.addEventListener('click', newRound);
  btnReset.addEventListener('click', resetBalance);
  maisNonClose.addEventListener('click', hideMaisNon);
  overlay.addEventListener('click', e => {
    if (e.target === overlay) hideMaisNon();
  });

  // Unlock audio on any first touch (critical for iPhone)
  document.body.addEventListener('touchstart', unlockAudio, { once: true });
  document.body.addEventListener('click', unlockAudio, { once: true });

  // ===== INIT =====
  loadBalance();
  updateBalanceUI();
  createShoe();
  setPhase('betting');

  // Preload French voices for "Mais non"
  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  // ===== SCREEN NAV =====
  function showScreen(name) {
    document.getElementById('screen-bj').classList.toggle('active', name === 'bj');
    document.getElementById('screen-cf').classList.toggle('active', name === 'cf');
    // sync shared balance displays when switching
    try {
      var s = localStorage.getItem('sems_gambling_balance');
      var v = s !== null ? parseInt(s, 10) : 1000;
      if (isNaN(v)) v = 1000;
      var fmt = function(n){ return n.toLocaleString('fr-FR') + ' €'; };
      var b1 = document.getElementById('balance');
      var b2 = document.getElementById('cfBalance');
      if (b1) b1.textContent = fmt(v);
      if (b2) b2.textContent = fmt(v);
      if (typeof balance !== 'undefined') balance = v;
    } catch(e){}
  }
  const btnGoCoin = document.getElementById('btnGoCoin');
  const btnGoBj = document.getElementById('btnGoBj');
  if (btnGoCoin) btnGoCoin.addEventListener('click', function() { showScreen('cf'); });
  if (btnGoBj) btnGoBj.addEventListener('click', function() { showScreen('bj'); });

  // ===== COIN FLIP =====
  (function(){
    const START = 1000;
    let bal = START, bet = 0, choice = null, flipping = false;
    const balEl = document.getElementById('cfBalance');
    const betEl = document.getElementById('cfBetDisplay');
    const resEl = document.getElementById('cfResult');
    const coin = document.getElementById('cfCoin');
    const btnP = document.getElementById('cfBtnPile');
    const btnF = document.getElementById('cfBtnFace');

    function load() {
      const s = localStorage.getItem('sems_gambling_balance');
      if (s !== null) { bal = parseInt(s,10); if (isNaN(bal)||bal<0) bal = START; }
      try { if (typeof balance !== 'undefined') balance = bal; } catch(e){}
    }
    function save() { localStorage.setItem('sems_gambling_balance', bal); }
    function fmt(n) { return n.toLocaleString('fr-FR') + ' €'; }
    function upd() {
      balEl.textContent = fmt(bal);
      betEl.textContent = fmt(bet);
      // shared balance display on BJ screen
      var bjBal = document.getElementById('balance');
      if (bjBal) bjBal.textContent = fmt(bal);
      // keep BJ game balance variable in sync if accessible
      try { if (typeof balance !== 'undefined') { balance = bal; } } catch(e){}
      const can = bet > 0 && bet <= bal && !flipping;
      btnP.disabled = !can; btnF.disabled = !can;
      save();
    }

    let actx = null;
    function ctx() {
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }
    function click() {
      try {
        const c = ctx(), t = c.currentTime;
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'triangle'; o.frequency.value = 900;
        g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.05);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.06);
      } catch(e){}
    }
    function flipSnd() {
      try {
        const c = ctx(), t = c.currentTime;
        const len = Math.floor(c.sampleRate*0.5);
        const buf = c.createBuffer(1,len,c.sampleRate);
        const d = buf.getChannelData(0);
        for (let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.2);
        const src = c.createBufferSource(); src.buffer = buf;
        const bp = c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1200; bp.Q.value=0.8;
        const g = c.createGain(); g.gain.setValueAtTime(0.22,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
        src.connect(bp); bp.connect(g); g.connect(c.destination); src.start(t);
        setTimeout(function(){
          try {
            const o2=c.createOscillator(), g3=c.createGain();
            o2.type='sine'; o2.frequency.setValueAtTime(140,c.currentTime);
            o2.frequency.exponentialRampToValueAtTime(45,c.currentTime+0.18);
            g3.gain.setValueAtTime(0.28,c.currentTime); g3.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.2);
            o2.connect(g3); g3.connect(c.destination); o2.start(); o2.stop(c.currentTime+0.22);
          } catch(e){}
        },1450);
      } catch(e){}
    }
    function winSnd() {
      try {
        const c=ctx(), t=c.currentTime;
        [523,659,784,1046].forEach(function(f,i){
          const o=c.createOscillator(), g=c.createGain();
          o.type='sine'; o.frequency.value=f;
          const st=t+i*0.1;
          g.gain.setValueAtTime(0.001,st); g.gain.exponentialRampToValueAtTime(0.14,st+0.02);
          g.gain.exponentialRampToValueAtTime(0.001,st+0.28);
          o.connect(g); g.connect(c.destination); o.start(st); o.stop(st+0.3);
        });
      } catch(e){}
    }
    function loseSnd() {
      try {
        const c=ctx(), t=c.currentTime;
        const o=c.createOscillator(), g=c.createGain();
        o.type='sine'; o.frequency.setValueAtTime(320,t); o.frequency.exponentialRampToValueAtTime(90,t+0.4);
        g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.45);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.5);
      } catch(e){}
    }

    function selectChip(v) {
      if (flipping || v > bal) return;
      click(); bet = v;
      document.querySelectorAll('.cf-chip').forEach(function(ch){
        ch.classList.toggle('selected', +ch.dataset.value === v);
      });
      resEl.textContent = 'Choisis Pile ou Face';
      resEl.className = 'cf-result wait';
      upd();
    }

    function selectChoice(side) {
      if (flipping || bet <= 0 || bet > bal) return;
      click(); choice = side;
      btnP.classList.toggle('picked', side==='pile');
      btnF.classList.toggle('picked', side==='face');
      doFlip();
    }

    function doFlip() {
      if (flipping || !choice || bet <= 0) return;
      flipping = true; btnP.disabled = true; btnF.disabled = true;
      bal -= bet; upd();
      resEl.textContent = 'Lancer…'; resEl.className = 'cf-result wait';
      flipSnd();
      var isPile = Math.random() < 0.5;
      var outcome = isPile ? 'pile' : 'face';
      coin.classList.remove('show-pile','show-face','flipping-pile','flipping-face');
      coin.style.transform = 'rotateY(0deg)';
      void coin.offsetWidth;
      coin.classList.add(isPile ? 'flipping-pile' : 'flipping-face');
      setTimeout(function(){
        coin.classList.remove('flipping-pile','flipping-face');
        coin.style.transform = '';
        coin.classList.add(isPile ? 'show-pile' : 'show-face');
        if (choice === outcome) {
          bal += bet * 2;
          resEl.textContent = (isPile?'PILE':'FACE') + ' — +' + fmt(bet);
          resEl.className = 'cf-result win';
          winSnd();
        } else {
          resEl.textContent = (isPile?'PILE':'FACE') + ' — Perdu';
          resEl.className = 'cf-result lose';
          loseSnd();
        }
        upd();
        flipping = false; choice = null;
        btnP.classList.remove('picked'); btnF.classList.remove('picked');
        var can = bet > 0 && bet <= bal;
        btnP.disabled = !can; btnF.disabled = !can;
        if (bal < 5) {
          resEl.textContent = 'Solde insuffisant';
          resEl.className = 'cf-result lose';
          btnP.disabled = true; btnF.disabled = true;
        }
      }, 1650);
    }

    document.getElementById('cfChips').addEventListener('click', function(e){
      var ch = e.target.closest('.cf-chip');
      if (ch) selectChip(+ch.dataset.value);
    });
    btnP.addEventListener('click', function(){ selectChoice('pile'); });
    btnF.addEventListener('click', function(){ selectChoice('face'); });
    document.getElementById('cfReset').addEventListener('click', function(){
      if (confirm('Réinitialiser le solde Coin Flip à 1 000 € ?')) {
        bal = START; bet = 0;
        document.querySelectorAll('.cf-chip').forEach(function(c){ c.classList.remove('selected'); });
        resEl.textContent = 'Mise → Pile ou Face';
        resEl.className = 'cf-result wait';
        upd();
      }
    });
    load(); upd();
  })();

})();
</script>
